<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Calculadora de Lanches" />
    <meta name="keywords" content="converter, .csv, lanche, horas, ponto," />
    <meta name="author" content="Douglas Silva" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="Calculadora de Lanches" />
    <meta property="og:description" content="Calculadora de Lanches" />
    <meta property="og:url" content="https://dougllassillva27.com.br/Calculadora-de-Lanches/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://dougllassillva27.com.br/logo-social-share.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Calculadora de Lanches" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Calculadora de Lanches" />
    <meta name="twitter:description" content="Calculadora de Lanches" />
    <meta name="twitter:image" content="https://dougllassillva27.com.br/logo-social-share.webp" />

    <title>Calculadora de Lanches</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="calculator-section">
        <h1>Calculadora de Lanches</h1>
        <div class="upload-section">
          <label for="fileInput" class="custom-file-upload">
            <i class="fas fa-upload"></i>
            Escolher Arquivo
          </label>
          <input type="file" id="fileInput" accept=".prn, .txt, .csv, .xls, .xlsx" />
          <button onclick="processFile()">
            <i class="fas fa-play"></i>
            Calcular Lanches
          </button>
        </div>
        <p id="calculatorFileName" class="file-name"></p>
        <div id="filterButtonContainer" style="display: none; text-align: center; margin: 10px 0">
          <button onclick="filterAbove15()" class="btn-filter">
            <i class="fas fa-filter"></i>
            Filtrar acima de 15min
          </button>
          <button onclick="clearFilter()" class="btn-clear-filter" style="margin-left: 10px">
            <i class="fas fa-times"></i>
            Limpar filtro
          </button>
        </div>
        <div id="loading" class="loading" style="display: none">
          <i class="fas fa-spinner fa-spin"></i>
          Processando...
        </div>
        <br />
        <div id="results" class="results"></div>
        <div class="actions">
          <button onclick="clearResults()" class="btn-clear">
            <i class="fas fa-trash"></i>
            Limpar Resultados
          </button>
          <button onclick="exportToCSV()" class="btn-export">
            <i class="fas fa-file-export"></i>
            Exportar para CSV
          </button>
        </div>
      </div>
      <footer id="footer">
        <p>
          Desenvolvido por
          <a href="https://www.linkedin.com/in/dougllassillva27/" target="_blank">Douglas Silva</a>
        </p>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
